name: Publish live map to GitHub Pages

# Every run fetches the latest Dublin Bus positions with the Java backend in one-shot mode,
# builds the frontend with that snapshot baked in, and deploys both to GitHub Pages.
# GitHub runs schedules every 5 minutes at most, and often later at busy times.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fetch vehicle positions
        working-directory: backend
        env:
          NTA_API_KEY: ${{ secrets.NTA_API_KEY }}
        run: |
          mvn -B -q package -DskipTests
          java -jar target/dublin-bus-live-0.1.0.jar \
            --spring.main.web-application-type=none \
            --app.export-file=../frontend/public/vehicles.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_DATA_URL: ./vehicles.json
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
