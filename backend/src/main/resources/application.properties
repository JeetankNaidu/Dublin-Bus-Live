server.port=8080

# Never commit a real key. Set NTA_API_KEY in your shell or a git-ignored .env.
nta.api-key=${NTA_API_KEY:}
nta.vehicles-url=https://api.nationaltransport.ie/gtfsr/v2/Vehicles
nta.refresh-ms=30000
nta.static-gtfs-url=https://www.transportforireland.ie/transitData/Data/GTFS_Dublin_Bus.zip

app.allowed-origins=http://localhost:5173

